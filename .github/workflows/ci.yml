# AI Town CI Pipeline
# Triggers: push/PR to main/develop, workflow_dispatch (manual re-trigger)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Lock down by default — each job declares only what it needs.
permissions: {}

# VCPKG_COMMIT_ID declared here only — reusable workflows receive it as input.
# NOTE: env context is not available in jobs.<job_id>.with for reusable workflow calls.
# A 'prepare' job reads env.VCPKG_COMMIT_ID and exposes it as a job output so that
# downstream with: blocks can reference it via ${{ needs.prepare.outputs.vcpkg_commit_id }}
# (needs context IS available in jobs.<job_id>.with).
env:
  VCPKG_COMMIT_ID: "b2f068faf45a3f04145bec0f52a66526ad590227"

jobs:
  # ============================================================================
  # prepare — exports workflow-level env vars as job outputs so they can be
  # referenced via needs context in reusable workflow with: blocks.
  # env context is NOT available in jobs.<job_id>.with; needs context IS available.
  # Evaluated for removal (E-18): GitHub Actions does not support ${{ env.* }} in
  # jobs.<id>.with for reusable workflow calls. The prepare job is the only supported
  # mechanism to pass workflow-level env vars as reusable workflow inputs. It cannot
  # be replaced with vars context (vars requires repository/org-level variable
  # configuration) or direct string literals (would require duplicating the commit ID
  # in every with: block, violating single-source-of-truth). Retain as-is.
  # ============================================================================
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: none
    outputs:
      vcpkg_commit_id: ${{ steps.set_vars.outputs.vcpkg_commit_id }}
    steps:
      - name: Export vcpkg commit ID
        id: set_vars
        shell: bash
        env:
          COMMIT_ID: ${{ env.VCPKG_COMMIT_ID }}
        run: echo "vcpkg_commit_id=${COMMIT_ID}" >> $GITHUB_OUTPUT

  # ============================================================================
  # compute-version — single version job for both main and develop pushes.
  # On main: increments patch, pushes a release tag (e.g. v0.1.1), outputs "0.1.1".
  # On develop: reads latest tag, appends -develop suffix (e.g. "0.1.1-develop").
  # Skipped on PRs. All packaging jobs depend only on this one job, avoiding
  # the skipped-job propagation problem that occurs when two branch-conditional
  # jobs are both listed in needs:.
  # ============================================================================
  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/fix/windows-package')
    permissions:
      contents: write
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          DEFAULT_MAIN: v0.0.21
          DEFAULT_DEVELOP: v0.0.0
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            CURRENT=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "${DEFAULT_MAIN}")
            # If history rewrite left only old tags reachable, fall back to DEFAULT_MAIN
            # when it is higher than what git describe found.
            if [ "$(printf '%s\n' "${DEFAULT_MAIN}" "${CURRENT}" | sort -V | tail -1)" = "${DEFAULT_MAIN}" ]; then
              CURRENT="${DEFAULT_MAIN}"
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            CURRENT=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "${DEFAULT_DEVELOP}")
            NEW_VERSION="${CURRENT#v}-develop"
          fi
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  supply-chain-lint:
    uses: ./.github/workflows/_supply-chain-lint.yml
    permissions:
      contents: read

  validate-assets:
    needs: [supply-chain-lint, prepare]
    uses: ./.github/workflows/_validate-assets.yml
    with:
      vcpkg_commit_id: ${{ needs.prepare.outputs.vcpkg_commit_id }}
    permissions:
      contents: read

  build-linux:
    needs: [supply-chain-lint, validate-assets, prepare]
    uses: ./.github/workflows/_build-linux.yml
    with:
      vcpkg_commit_id: ${{ needs.prepare.outputs.vcpkg_commit_id }}
    permissions:
      packages: read
      checks: write
      contents: read

  build-windows:
    needs: [supply-chain-lint, validate-assets, prepare]
    uses: ./.github/workflows/_build-windows.yml
    with:
      vcpkg_commit_id: ${{ needs.prepare.outputs.vcpkg_commit_id }}
    permissions:
      checks: write
      contents: read

  coverage-linux:
    needs: [supply-chain-lint, validate-assets, prepare]
    uses: ./.github/workflows/_coverage-linux.yml
    with:
      vcpkg_commit_id: ${{ needs.prepare.outputs.vcpkg_commit_id }}
    permissions:
      packages: read
      checks: write
      contents: read

  markdown-lint:
    uses: ./.github/workflows/_markdown-lint.yml
    permissions:
      contents: read

  asan-linux:
    needs: [supply-chain-lint, validate-assets, prepare]
    uses: ./.github/workflows/_asan-linux.yml
    permissions:
      packages: read
      contents: read

  # ============================================================================
  # all-checks-pass — gate job required by branch protection
  # Must run with if: always() so it executes even when dependency jobs fail.
  # The explicit Bash-array form is the canonical form — do NOT substitute with
  # contains(needs.*.result, 'failure') (misses skipped) or grep-based patterns.
  # Stays as inline steps: in ci.yml — it is a simple bash gate script and does
  # not benefit from being a reusable workflow.
  # ============================================================================
  all-checks-pass:
    needs:
      - prepare
      - supply-chain-lint
      - validate-assets
      - build-linux
      - build-windows
      - coverage-linux
      - markdown-lint
      - asan-linux
      - package-windows
      - package-linux-deb
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions: {}   # only runs a bash gate script — no permissions needed
    steps:
      - name: Verify all platform builds passed
        shell: bash
        run: |
          # Core jobs: must be 'success' on every trigger.
          core_results=(
            "${{ needs.prepare.result }}"
            "${{ needs.supply-chain-lint.result }}"
            "${{ needs.validate-assets.result }}"
            "${{ needs.build-linux.result }}"
            "${{ needs.build-windows.result }}"
            "${{ needs.coverage-linux.result }}"
            "${{ needs.markdown-lint.result }}"
            "${{ needs.asan-linux.result }}"
          )
          # Package jobs: required to be 'success' on push to develop only.
          # On push to main (develop→main merge) or PRs, 'success', 'skipped',
          # and 'failure' are all acceptable — package failures on main must not
          # block branch protection (future merges) via this gate.  The release
          # job enforces package quality independently on main pushes.
          package_results=(
            "${{ needs.package-windows.result }}"
            "${{ needs.package-linux-deb.result }}"
          )
          failed=0
          for result in "${core_results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "Core job result '$result' is not 'success' — failing gate."
              failed=1
            fi
          done
          for result in "${package_results[@]}"; do
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/develop" ]]; then
              # On develop: packages are the pre-release quality gate — must succeed.
              if [[ "$result" != "success" ]]; then
                echo "Package job result '$result' on develop push is not 'success' — failing gate."
                failed=1
              fi
            else
              # Everywhere else (push to main, PRs, feature branches, workflow_dispatch):
              # success, skipped, and failure are all acceptable outcomes.
              if [[ "$result" == "cancelled" ]]; then
                echo "Package job was cancelled — failing gate."
                failed=1
              fi
            fi
          done
          if [[ $failed -eq 1 ]]; then
            echo "One or more required jobs did not succeed (failed, skipped, or cancelled)."
            exit 1
          fi
          echo "All required jobs succeeded."

  package-windows:
    needs: [build-windows, prepare, compute-version]
    # TEMP: fix/windows-package included to verify the NSIS zlib compressor fix.
    # Remove the fix/windows-package clause before merging to develop.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/fix/windows-package')
    uses: ./.github/workflows/_package-windows.yml
    with:
      vcpkg_commit_id: ${{ needs.prepare.outputs.vcpkg_commit_id }}
      pkg_version: ${{ needs.compute-version.outputs.version }}
    permissions:
      contents: read

  package-linux-deb:
    needs: [build-linux, prepare, compute-version]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/_package-linux-deb.yml
    with:
      vcpkg_commit_id: ${{ needs.prepare.outputs.vcpkg_commit_id }}
      pkg_version: ${{ needs.compute-version.outputs.version }}
    permissions:
      contents: read

  # bump-version removed — replaced by compute-version above.

  # ============================================================================
  # release — downloads the Windows installer and all 4 distro .deb artifacts
  # produced by the package jobs, then creates a GitHub release with all 5.
  # Uses the version tag produced by bump-version (needs.bump-version.outputs.version).
  # Runs only on main pushes, after compute-version and both package jobs succeed.
  # Not in all-checks-pass gate.
  # ============================================================================
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compute-version, package-windows, package-linux-deb]
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Download Windows installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: aitown-installer-windows-${{ github.sha }}
          path: ./release-assets/

      - name: Download Linux .deb (bookworm)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: aitown-deb-debian-bookworm-${{ github.sha }}
          path: ./release-assets/

      - name: Download Linux .deb (trixie)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: aitown-deb-debian-trixie-${{ github.sha }}
          path: ./release-assets/

      - name: Download Linux .deb (jammy)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: aitown-deb-ubuntu-jammy-${{ github.sha }}
          path: ./release-assets/

      - name: Download Linux .deb (noble)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: aitown-deb-ubuntu-noble-${{ github.sha }}
          path: ./release-assets/

      # Generate changelog from commits since the previous version tag.
      # Commits are grouped by conventional-commit prefix (feat/fix/ci/chore/docs/test).
      # Falls back to "Initial release" when no prior tag exists.
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          extract() {
            git log "$RANGE" --pretty=format:"%s" | grep -E "^$1" | sed "s/^$1[^:]*: /- /" || true
          }
          FEATS=$(extract "feat")
          FIXES=$(extract "fix")
          CI=$(extract "ci")
          DOCS=$(extract "docs")
          TESTS=$(extract "test")
          CHORES=$(extract "chore")
          BODY=""
          [ -n "$FEATS" ]  && BODY="${BODY}### Features\n${FEATS}\n\n"
          [ -n "$FIXES" ]  && BODY="${BODY}### Bug Fixes\n${FIXES}\n\n"
          [ -n "$CI" ]     && BODY="${BODY}### CI/CD\n${CI}\n\n"
          [ -n "$TESTS" ]  && BODY="${BODY}### Tests\n${TESTS}\n\n"
          [ -n "$DOCS" ]   && BODY="${BODY}### Documentation\n${DOCS}\n\n"
          [ -n "$CHORES" ] && BODY="${BODY}### Chores\n${CHORES}\n\n"
          [ -z "$BODY" ]   && BODY="Initial release.\n"
          printf "%b" "$BODY" > /tmp/changelog.md
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      # Create GitHub release (tag created atomically by the releases API).
      #
      # The git-refs API (POST /git/refs) is not used — it returns 422 even
      # when the tag does not exist (likely a GitHub policy on this repo). The
      # releases API (POST /releases with target_commitish) creates the
      # lightweight tag and release atomically, which is how v0.0.1–v0.0.13
      # were successfully created.
      #
      # Cleanup sequence before creating:
      #   1. Delete existing release by ID (immutable releases reject the tag-
      #      name DELETE endpoint with 422 — look up by ID first).
      #   2. Delete the orphan tag left by a previously failed run (if any).
      #      Uses || true so a missing tag doesn't abort the step.
      #   3. gh release create --target pins the new tag to github.sha.
      #   4. If the release API rejects the tag with "tag_name was used by an
      #      immutable release" (permanently reserved name), increment patch and
      #      retry — git push --dry-run does NOT enforce GitHub rulesets so the
      #      probe must happen at release-create time instead.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.compute-version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG#v}"
          for _ in $(seq 1 10); do
            # Look up release ID by tag; guard against non-numeric output (e.g. a
            # JSON error object when the tag does not exist — gh api may print the
            # raw error JSON to stdout even when --jq is supplied on a non-2xx
            # response).
            RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.id' 2>/dev/null || true)
            if [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" || true
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              2>/dev/null || true
            CREATE_OUT=$(gh release create "${TAG}" \
              --title "AI Town ${TAG}" \
              --notes-file /tmp/changelog.md \
              --target "${{ github.sha }}" \
              release-assets/** 2>&1) && { echo "$CREATE_OUT"; break; }
            if echo "$CREATE_OUT" | grep -qi "tag_name was used by an immutable release"; then
              echo "${TAG} reserved by immutable release, trying next patch."
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              echo "$CREATE_OUT" >&2
              exit 1
            fi
          done
