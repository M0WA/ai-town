# Markdown lint — reusable workflow
# Enforces consistent Markdown formatting across all spec files.
# Runs independently of all build jobs — starts immediately on trigger and completes in seconds.
# No vcpkg, CMake, or C++ toolchain needed.
# Prerequisite: .markdownlint.json must be present at repository root.
# Called by ci.yml with no inputs.
name: Markdown Lint

on:
  workflow_call:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout only — no write access needed
    steps:
      # Step 1: Checkout — makes .markdownlint.json and all .md files available on disk.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Run markdownlint via npx — no global install step needed.
      # Pinned to v0.47.0 for reproducible linting behavior.
      # Exits 1 on any violation — job fails and blocks all-checks-pass.
      # Rule configuration is read from .markdownlint.json at repo root.
      - name: Run markdownlint
        run: npx markdownlint-cli@0.47.0 'architecture/**/*.md' 'implementation/*.md' 'CLAUDE.md'
