# Validate assets — reusable workflow
# Runs tools/validate_assets.py and all source-tree presence gates.
# Called by ci.yml with vcpkg_commit_id input.
# Current highest check number in tools/validate_assets.py: check_31.
# timeout-minutes: 10 is permanent.
name: Validate Assets

on:
  workflow_call:
    inputs:
      vcpkg_commit_id:
        type: string
        required: true

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # minimum required — checkout only
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'  # pin to specific minor version — never use '3' (floating major breaks reproducibility)

      # Verify all required check functions are present in validate_assets.py.
      # Adding a new check: add its identifier to the list below. One loop step
      # replaces N individual steps so new checks cost a single-line addition.
      - name: Verify required checks present in validate_assets.py
        shell: bash
        run: |
          failed=0
          for check in \
            check_20 \
            check_21 \
            check_22 \
            check_23 \
            check_24_clouds_png \
            check_25 \
            check_26 \
            check_27 \
            check_28 \
            check_29 \
            check_30 \
            check_31; do
            if grep -q "$check" tools/validate_assets.py; then
              echo "PASS: $check present"
            else
              echo "FAIL: $check not found in tools/validate_assets.py"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      - name: Verify hud_sprites_ui.dds not git-tracked
        # The DDS intermediate is an authoring artifact and must never be committed.
        # .gitignore has the entry; git rm --cached was run in Phase 10.
        # This step catches any accidental re-addition via 'git add --force'.
        # git ls-files exits 0 and prints the path if the file is tracked; we invert
        # the logic so CI fails when the file IS present in the index.
        shell: bash
        run: |
          if git ls-files --error-unmatch assets/textures/ui/hud_sprites_ui.dds 2>/dev/null; then
            echo "ERROR: assets/textures/ui/hud_sprites_ui.dds is still tracked by git."
            echo "Run 'git rm --cached assets/textures/ui/hud_sprites_ui.dds' and commit the result."
            exit 1
          fi
          echo "PASS: hud_sprites_ui.dds is not git-tracked."

      - name: Verify hud_sprites_ui_layout.json not git-tracked
        # hud_sprites_ui_layout.json is an incompatible legacy layout artifact that must not
        # be used as an authoring reference. It was removed in Phase 10 (git rm).
        shell: bash
        run: |
          if git ls-files --error-unmatch assets/textures/ui/hud_sprites_ui_layout.json 2>/dev/null; then
            echo "ERROR: assets/textures/ui/hud_sprites_ui_layout.json is still tracked by git."
            echo "Run 'git rm assets/textures/ui/hud_sprites_ui_layout.json' and commit the result."
            exit 1
          fi
          echo "PASS: hud_sprites_ui_layout.json is not git-tracked."

      - name: Install Python dependencies
        # mutagen: OGG/WAV metadata (checks #16–#19).
        # Pillow: PNG image dimension and mode check (check #23 — hud_sprites_ui.png 2048x2048 RGBA).
        # Versions pinned for reproducibility; update when a new check requires a newer API.
        # ffmpeg: required by check_21 (_decode_ogg_pcm_int16) to decode sfx_zone_*.ogg to
        # raw int16 PCM for the silence-floor gate. Installed as a system package (not pip)
        # because the Python ffmpeg bindings are wrappers around the ffmpeg binary anyway.
        run: |
          pip install "mutagen==1.47.0" "Pillow==10.4.0"
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify shader assets
        # Source-tree check — no build artifacts required.
        # Moved from build-linux/coverage-linux per Phase 11i consolidation rule:
        # any step checking source-tree file existence belongs in validate-assets.
        shell: bash
        run: |
          test -f assets/shaders/ui_quad.vert || { echo "ERROR: assets/shaders/ui_quad.vert not found"; exit 1; }
          test -f assets/shaders/ui_quad.frag || { echo "ERROR: assets/shaders/ui_quad.frag not found"; exit 1; }
          echo "Shader assets verified."

      - name: Run asset validation
        run: python tools/validate_assets.py

      # Step: Validate vcpkg baseline consistency.
      # vcpkg.json builtin-baseline must match the vcpkg_commit_id input.
      # Runs after asset validation so fast checks pass before this comparison.
      - name: Validate vcpkg baseline consistency
        shell: bash
        env:
          EXPECTED_BASELINE: ${{ inputs.vcpkg_commit_id }}
        run: |
          MANIFEST_BASELINE=$(jq -r '."builtin-baseline"' vcpkg.json)
          if [[ "$MANIFEST_BASELINE" != "$EXPECTED_BASELINE" ]]; then
            echo "ERROR: vcpkg.json builtin-baseline does not match VCPKG_COMMIT_ID"
            echo "  vcpkg.json builtin-baseline: $MANIFEST_BASELINE"
            echo "  VCPKG_COMMIT_ID:             $EXPECTED_BASELINE"
            exit 1
          fi
          echo "vcpkg baseline validation passed: $MANIFEST_BASELINE"

      # Step: Verify clouds.png present.
      - name: Verify clouds.png present
        shell: bash
        run: |
          test -f assets/textures/sky/clouds.png || { echo "ERROR: assets/textures/sky/clouds.png missing"; exit 1; }

      # Step: Verify font assets present.
      # hud_font.xml and hud_mono_font.xml are required at runtime by UIManager.
      - name: Verify font assets present
        shell: bash
        run: |
          if [ ! -f assets/fonts/hud_font.xml ]; then
            echo "ERROR: assets/fonts/hud_font.xml not found — Phase 10 font asset missing."
            exit 1
          fi
          echo "assets/fonts/hud_font.xml: present."
          if [ ! -f assets/fonts/hud_mono_font.xml ]; then
            echo "ERROR: assets/fonts/hud_mono_font.xml not found — Phase 10 font asset missing."
            exit 1
          fi
          echo "assets/fonts/hud_mono_font.xml: present."

      # Step: Verify Phase 10 audio assets present.
      # Hard-fail on core Phase 10 audio assets that must be present before build.
      - name: Verify Phase 10 audio assets present
        shell: bash
        run: |
          failed=0
          for asset in \
            assets/audio/sfx_build_place.wav \
            assets/audio/sfx_build_demolish.wav \
            assets/audio/stinger_milestone.wav \
            assets/audio/ambient_day.ogg \
            assets/audio/sfx_zone_residential.ogg \
            assets/audio/sfx_zone_commercial.ogg \
            assets/audio/sfx_zone_industrial.ogg; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: $asset not found — Phase 10 audio asset missing."
              failed=1
            else
              echo "$asset: present."
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      # Step: Verify terrain assets present.
      # terrain_grass_d.dds, terrain_asphalt_d.dds, terrain_soil_d.dds, terrain_concrete_d.dds
      # (diffuse DDS; normal-map validation is out of scope for this phase),
      # terrain_chunk_splat.png, terrain.vert, terrain.frag.
      - name: Verify terrain assets present
        shell: bash
        run: |
          test -f assets/textures/terrain/terrain_grass_d.dds    || { echo "ERROR: terrain_grass_d.dds missing"; exit 1; }
          test -f assets/textures/terrain/terrain_asphalt_d.dds  || { echo "ERROR: terrain_asphalt_d.dds missing"; exit 1; }
          test -f assets/textures/terrain/terrain_soil_d.dds     || { echo "ERROR: terrain_soil_d.dds missing"; exit 1; }
          test -f assets/textures/terrain/terrain_concrete_d.dds || { echo "ERROR: terrain_concrete_d.dds missing"; exit 1; }
          test -f assets/textures/terrain/terrain_chunk_splat.png || { echo "ERROR: terrain_chunk_splat.png missing"; exit 1; }
          test -f assets/shaders/terrain.vert || { echo "ERROR: terrain.vert missing"; exit 1; }
          test -f assets/shaders/terrain.frag || { echo "ERROR: terrain.frag missing"; exit 1; }
