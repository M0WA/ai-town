# Build Linux — reusable workflow
# Fast binary-verification build (ENABLE_COVERAGE=OFF).
# Called by ci.yml after supply-chain-lint and validate-assets.
# Preflight steps (SHA lint, asset validation, clouds/font/audio/terrain checks,
# vcpkg baseline) are handled by the supply-chain-lint and validate-assets jobs
# and are NOT duplicated here.
#
# Two-job structure:
#   build-linux  — compile and upload the build directory artifact.
#   test-linux   — delegate all ctest steps to _test-linux.yml (reusable workflow).
name: Build Linux

on:
  workflow_call:
    inputs:
      vcpkg_commit_id:
        type: string
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/m0wa/aitown-ci-linux:vcpkg-b2f068f@sha256:9623ce264965034d6176c66ada1f1029688e64d9233f16e0f15f605d4ecab109
      options: --user root
    permissions:
      packages: read    # pull from GHCR
      contents: read    # required by actions/checkout
    steps:
      # Checkout (must be first — makes workflow files available on disk for subsequent steps).
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Detect GCC version and write to GITHUB_ENV.
      # MUST be a SEPARATE named step before the actions/cache step.
      # $GITHUB_ENV writes are not visible within the same step.
      - name: Detect GCC version
        shell: bash
        run: |
          echo "COMPILER_VERSION=$(gcc -dumpfullversion -dumpversion)" >> $GITHUB_ENV

      # Set up ccache (Linux only — ccache does not support cl.exe on Windows).
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@33522472633dbd32578e909b315f5ee43ba878ce  # v1.2.22
        with:
          key: ${{ runner.os }}-ccache-${{ env.COMPILER_VERSION }}

      # Configure CMake.
      # ENABLE_COVERAGE=OFF for the fast build-linux job (via ci-linux preset).
      # CMakePresets.json defines: Ninja generator, ccache launchers, ENABLE_COVERAGE=OFF.
      - name: Configure CMake
        run: cmake --preset ci-linux -DVCPKG_INSTALLED_DIR=/opt/vcpkg_installed -DVCPKG_MANIFEST_INSTALL=OFF

      # Build.
      - name: Build
        run: cmake --build build --parallel

      # Verify libGLEW.a artifact.
      # Globbed path — triplet-agnostic; do NOT hard-code a triplet subdirectory.
      # Fails if GLEW was not built/installed by vcpkg (e.g., missing glew from vcpkg.json).
      - name: Verify libGLEW.a artifact (CI-1)
        shell: bash
        run: |
          find /opt/vcpkg_installed -name "libGLEW.a" | grep -q "libGLEW.a" || \
            { echo "ERROR: libGLEW.a not found under /opt/vcpkg_installed. Ensure glew is in vcpkg.json."; exit 1; }
          echo "libGLEW.a found."

      # Verify default.mhr HRTF data — hard-fail.
      # Checks build/default.mhr (relative path) which is where the POST_BUILD
      # copy_if_different rule writes the file from /opt/vcpkg_installed.
      # Relative path avoids the ${{ github.workspace }} vs /__w/ container mismatch.
      # Without this file, AudioSystem HRTF initialization fails at runtime.
      - name: Verify default.mhr HRTF data
        shell: bash
        run: |
          if ! test -f build/default.mhr; then
            echo "ERROR: build/default.mhr not found — HRTF initialization will fail at runtime"
            exit 1
          fi
          echo "default.mhr present at build/default.mhr."

            # Normalize compile_commands.json paths for SonarCloud.
      # CMake generates absolute paths rooted at the container workspace (/__w/...).
      # SonarCloud CFamily checks out sources at a different absolute path, so we
      # strip the prefix to produce project-root-relative paths sonar.cfamily can match.
      - name: Normalize compile_commands.json for SonarCloud
        run: |
          python3 .github/scripts/normalize_compile_commands.py \
            build/compile_commands.json compile_commands.json

      # Upload compile_commands.json for SonarCloud (sonarcloud.yml downloads via workflow_run).
      - name: Upload compile_commands.json
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: compile-commands-linux-${{ github.sha }}
          path: compile_commands.json
          retention-days: 14

      # Upload the build directory so the test-linux job can run ctest against it.
      # Includes all test binaries, CTestTestfile.cmake, and CTest-discovered test lists.
      # The staging artifact (aitown binary + default.mhr) is uploaded separately below.
      - name: Upload build artifact for test job
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: build-linux-${{ github.sha }}
          path: build/
          retention-days: 1

      # Upload Linux staging artifact (on push to main or develop).
      # Used by package-linux-deb to run CPack without rebuilding.
      - name: Upload Linux staging artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: aitown-staging-linux-${{ github.sha }}
          path: |
            build/aitown
            build/default.mhr
          retention-days: 30

  # Delegate all ctest steps (routing checks, unit/integration/opengl runs, result
  # publishing) to the shared _test-linux.yml reusable workflow.
  test-linux:
    needs: build-linux
    permissions:
      packages: read
      checks: write
      contents: read
    uses: ./.github/workflows/_test-linux.yml
    with:
      build_artifact_name: build-linux-${{ github.sha }}
      build_dir: build
      reporter_name: 'Linux Unit Tests'
      test_artifact_name: test-results-build-linux-${{ github.sha }}
