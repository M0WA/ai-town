# https://github.com/microsoft/msvc-code-analysis-action

name: Microsoft C++ Code Analysis

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "33 13 * * 0"

env:
  build: "${{ github.workspace }}/build"
  VCPKG_COMMIT_ID: "b2f068faf45a3f04145bec0f52a66526ad590227"

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Detect MSVC version for cache key — must be a separate step before actions/cache
      # so that $GITHUB_ENV writes are visible to the cache step.
      - name: Detect MSVC version
        shell: pwsh
        run: |
          $version = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationVersion
          "COMPILER_VERSION=$version" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ env.COMPILER_VERSION }}-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT_ID }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.COMPILER_VERSION }}-${{ env.VCPKG_COMMIT_ID }}-
            vcpkg-${{ runner.os }}-${{ env.COMPILER_VERSION }}-

      # Set up MSVC environment (vcvarsall x64) before vcpkg so cold-cache source builds
      # use the same toolchain that CMake/Ninja will use.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0

      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Configure CMake
        run: cmake --preset ci-windows
        shell: pwsh

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          ruleset: NativeRecommendedRules.ruleset

      # CodeQL upload-sarif rejects SARIF files with multiple runs.
      # The MSVC analysis action produces one run per build target; keep only the first.
      - name: Filter SARIF to single run
        shell: pwsh
        run: |
          $sarifPath = "${{ steps.run-analysis.outputs.sarif }}"
          $sarif = Get-Content $sarifPath -Raw | ConvertFrom-Json
          if ($sarif.runs.Count -gt 1) {
            $sarif.runs = @($sarif.runs[0])
            $sarif | ConvertTo-Json -Depth 100 | Set-Content $sarifPath
          }

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}
          category: msvc-code-analysis

      - name: Upload SARIF as an Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sarif-file
          path: ${{ steps.run-analysis.outputs.sarif }}
