# AI Town CI Pipeline
# Triggers: push/PR to main/develop, workflow_dispatch (manual re-trigger)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# permissions block — required for dorny/test-reporter to write PR annotations.
permissions:
  checks: write       # required by dorny/test-reporter to post check results
  contents: read      # required to checkout code
  packages: read      # required by build-linux and coverage-linux to pull GHCR image

# VCPKG_COMMIT_ID declared here only — reusable workflows receive it as input.
env:
  VCPKG_COMMIT_ID: "b2f068faf45a3f04145bec0f52a66526ad590227"

jobs:
  supply-chain-lint:
    uses: ./.github/workflows/_supply-chain-lint.yml
    permissions:
      contents: read

  validate-assets:
    needs: [supply-chain-lint]
    uses: ./.github/workflows/_validate-assets.yml
    with:
      vcpkg_commit_id: ${{ env.VCPKG_COMMIT_ID }}
    permissions:
      contents: read

  build-linux:
    needs: [supply-chain-lint, validate-assets]
    uses: ./.github/workflows/_build-linux.yml
    with:
      vcpkg_commit_id: ${{ env.VCPKG_COMMIT_ID }}
    permissions:
      packages: read
      checks: write
      contents: read

  build-windows:
    needs: [supply-chain-lint, validate-assets]
    uses: ./.github/workflows/_build-windows.yml
    with:
      vcpkg_commit_id: ${{ env.VCPKG_COMMIT_ID }}
    permissions:
      checks: write
      contents: read

  coverage-linux:
    needs: [supply-chain-lint, validate-assets]
    uses: ./.github/workflows/_coverage-linux.yml
    with:
      vcpkg_commit_id: ${{ env.VCPKG_COMMIT_ID }}
    permissions:
      packages: read
      checks: write
      contents: read

  markdown-lint:
    uses: ./.github/workflows/_markdown-lint.yml
    permissions:
      contents: read

  # ============================================================================
  # all-checks-pass — gate job required by branch protection
  # Must run with if: always() so it executes even when dependency jobs fail.
  # The explicit Bash-array form is the canonical form — do NOT substitute with
  # contains(needs.*.result, 'failure') (misses skipped) or grep-based patterns.
  # Stays as inline steps: in ci.yml — it is a simple bash gate script and does
  # not benefit from being a reusable workflow.
  # ============================================================================
  all-checks-pass:
    needs:
      - supply-chain-lint
      - validate-assets
      - build-linux
      - build-windows
      - coverage-linux
      - markdown-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Verify all platform builds passed
        shell: bash
        run: |
          results=(
            "${{ needs.supply-chain-lint.result }}"
            "${{ needs.validate-assets.result }}"
            "${{ needs.build-linux.result }}"
            "${{ needs.build-windows.result }}"
            "${{ needs.coverage-linux.result }}"
            "${{ needs.markdown-lint.result }}"
          )
          failed=0
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "Job result '$result' is not 'success' — failing gate."
              failed=1
            fi
          done
          if [[ $failed -eq 1 ]]; then
            echo "One or more required jobs did not succeed (failed, skipped, or cancelled)."
            exit 1
          fi
          echo "All required jobs succeeded."

  package-windows:
    needs: [build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/_package-windows.yml
    with:
      vcpkg_commit_id: ${{ env.VCPKG_COMMIT_ID }}
    permissions:
      contents: read

  package-linux-deb:
    needs: [build-linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/_package-linux-deb.yml
    with:
      vcpkg_commit_id: ${{ env.VCPKG_COMMIT_ID }}
    permissions:
      contents: read
