# Temporary debug workflow — delete after SonarCloud is working.
# Downloads an existing CI artifact, applies the current normalization
# script from the repo, then runs sonar-scanner. Lets us iterate on
# normalize_compile_commands.py without a full CI rebuild.
name: SonarCloud debug

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI run ID that produced the compile-commands artifact'
        required: true
        type: string
      head_sha:
        description: 'HEAD SHA of that CI run'
        required: true
        type: string

env:
  SONAR_SCANNER_VERSION: 7.0.2.4839
  SONAR_SCANNER_BINARIES_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Download coverage XML
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: coverage-sonar-linux-${{ inputs.head_sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Download raw compile_commands.json
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: compile-commands-linux-${{ inputs.head_sha }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Normalize compile_commands.json (using current repo script)
        run: |
          echo "=== RAW first entry ==="
          python3 -c "import json; e=json.load(open('compile_commands.json'))[0]; print('file:', e['file']); print('dir:', e['directory']); print('cmd:', e['command'][:120])"
          python3 .github/scripts/normalize_compile_commands.py compile_commands.json compile_commands.json
          echo "=== NORMALIZED first entry ==="
          python3 -c "import json; e=json.load(open('compile_commands.json'))[0]; print('file:', e['file']); print('dir:', e['directory']); print('cmd:', e['command'][:120])"
          echo "=== Dirty entries ==="
          python3 -c "
          import json
          db = json.load(open('compile_commands.json'))
          bad = [e for e in db if '/__w/' in e.get('file','') or '/__w/' in e.get('directory','') or '/__w/' in e.get('command','') or '/usr/bin/c++' in e.get('command','')]
          print(f'Bad entries remaining: {len(bad)}')
          "

      - name: Install Sonar Scanner CLI
        run: |
          mkdir -p "$RUNNER_TEMP/sonarscanner"
          cd "$RUNNER_TEMP/sonarscanner"
          SCANNER_FILE="sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-x64.zip"
          curl --fail --silent --show-error --user-agent sonarqube-scan-action \
               --location --output "$SCANNER_FILE" \
               "${SONAR_SCANNER_BINARIES_URL}/${SCANNER_FILE}"
          unzip -q -o "$SCANNER_FILE"
          mv -f "sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64" \
               "$RUNNER_TEMP/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-Linux-X64"

      - name: Run SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          SCANNER_BIN="$RUNNER_TEMP/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-Linux-X64/bin/sonar-scanner"
          "$SCANNER_BIN" \
            -Dsonar.projectKey=M0WA_ai-town \
            -Dsonar.organization=m0wa \
            -Dsonar.sources=src,.github/workflows,docker,.devcontainer \
            -Dsonar.tests=tests \
            -Dsonar.coverageReportPaths=coverage.xml \
            -Dsonar.exclusions="assets/**,build/**,tools/**" \
            -Dsonar.cpd.exclusions="tests/**" \
            -Dsonar.scm.provider=git \
            -Dsonar.projectBaseDir=. \
            -Dsonar.cfamily.compile-commands=compile_commands.json
