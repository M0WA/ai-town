# SonarCloud analysis triggered after CI completes.
# Downloads the Cobertura XML artifact produced by coverage-linux and runs the scan.
name: SonarCloud analysis

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout (full history for blame/new-code)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Cobertura coverage XML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.1.0
        with:
          name: coverage-cobertura-linux-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@5c8a8a642e79153f5d047b10ec1cba1d1cc65699  # v3.35.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=M0WA_ai-town
            -Dsonar.organization=m0wa
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.coverageReportPaths=coverage.xml
            -Dsonar.exclusions=assets/**,build/**,tools/**
            -Dsonar.cpd.exclusions=tests/**
          projectBaseDir: .
