# Test Linux — reusable workflow
# Shared ctest verification steps used by both build-linux and coverage-linux.
# Callers upload their build directory as an artifact and pass the artifact name
# via the build_artifact_name input.  This job downloads the artifact, runs all
# three ctest suites (unit / integration / requires-opengl), publishes results,
# and uploads the test XML artifact.
#
# Inputs:
#   build_artifact_name : name of the artifact containing the build directory
#                         (uploaded by the caller before invoking this workflow)
#   build_dir           : path to the CMake build directory (default: build)
#   reporter_name       : display name for dorny/test-reporter (caller-specific)
#   test_artifact_name  : name for the uploaded test-results artifact
name: Test Linux (shared)

on:
  workflow_call:
    inputs:
      build_artifact_name:
        type: string
        required: true
      build_dir:
        type: string
        required: false
        default: build
      reporter_name:
        type: string
        required: false
        default: 'Linux Tests'
      test_artifact_name:
        type: string
        required: false
        default: 'test-results-linux'

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/m0wa/aitown-ci-linux@sha256:52f7ddf4d4130144f41f72466ffe4a3b85c662f73c509aa415b58f067fb3dc74
    permissions:
      packages: read
      checks: write
      contents: read
    env:
      BUILD_DIR: ${{ inputs.build_dir }}
    steps:
      - name: Mark workspace as git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Download the build directory artifact uploaded by the caller job.
      # The artifact contains the compiled binaries, CTestTestfile.cmake, and
      # CTest-discovered test lists needed by all subsequent ctest invocations.
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: ${{ inputs.build_artifact_name }}
          path: ${{ inputs.build_dir }}

      # Restore execute permissions on test binaries.
      # actions/upload-artifact strips permissions; chmod is required before ctest.
      - name: Restore execute permissions on test binaries
        shell: bash
        run: find "$BUILD_DIR" -maxdepth 2 -type f -name '*_tests' -exec chmod +x {} \;

      # Verify integration test routing (non-zero discovery).
      # IrrlichtUIBackendCompileCheck::IsNonAbstract is registered under the 'integration' label.
      # See architecture/testing/framework.md for rationale.
      - name: Verify integration test routing (non-zero discovery)
        shell: bash
        run: |
          count=$(ctest --test-dir "${BUILD_DIR}" -N -L '^integration$' 2>/dev/null | grep -c 'Test #' || true)
          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: No tests discovered under integration label."
            exit 1
          fi
          echo "Integration routing: $count test(s) discovered."

      # Verify requires-opengl test routing (non-zero discovery).
      # Must appear BEFORE xvfb-run ctest to confirm routing before execution.
      - name: Verify requires-opengl test routing (non-zero discovery)
        shell: bash
        run: |
          count=$(ctest --test-dir "${BUILD_DIR}" -N -L '^requires-opengl$' 2>/dev/null | grep -c 'Test #' || true)
          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: No tests discovered under requires-opengl label."
            exit 1
          fi
          echo "requires-opengl routing: $count test(s) discovered."

      # Verify unit test routing (non-zero discovery).
      # Uses -N dry-run + grep -E 'Test +#' (handles ctest alignment padding for test #1-9999).
      - name: Verify unit test routing (non-zero discovery)
        shell: bash
        run: |
          count=$(ctest --test-dir "${BUILD_DIR}" -N -L '^unit$' 2>/dev/null | grep -cE 'Test +#' || true)
          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: No tests discovered under unit label."
            exit 1
          fi
          echo "Unit routing: $count test(s) discovered."

      # Verify simulation_tests is discoverable.
      # The unit-routing check above passes as long as ANY unit target has tests.
      # This step verifies simulation_tests is not silently unregistered.
      - name: Verify simulation_tests registration
        shell: bash
        run: |
          count=$(ctest --test-dir "${BUILD_DIR}" -N -L '^unit$' 2>/dev/null | grep -i 'simulation' | grep -cE 'Test +#' || true)
          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: No simulation_tests test cases discovered."
            exit 1
          fi
          echo "simulation_tests routing: $count test(s) discovered."

      # Create test_results directory once before all ctest invocations.
      - name: Create test results directory
        run: mkdir -p test_results

      # Run unit tests.
      # AITOWN_HEADLESS=1 — guard against unit tests that inadvertently trigger IrrlichtDevice init.
      # ALSOFT_DRIVERS=null — guard against unit tests that inadvertently trigger AudioSystem init.
      - name: Run unit tests (no display)
        run: ctest --test-dir "${BUILD_DIR}" -LE 'integration|requires-opengl' --output-on-failure
        env:
          GTEST_OUTPUT: 'xml:test_results/'
          AITOWN_HEADLESS: '1'
          ALSOFT_DRIVERS: 'null'

      # Run integration tests. Uses EDT_NULL Irrlicht (no display) + null audio driver.
      - name: Run integration tests (no display, EDT_NULL)
        run: ctest --test-dir "${BUILD_DIR}" -L '^integration$' --output-on-failure
        env:
          GTEST_OUTPUT: 'xml:test_results/'
          AITOWN_HEADLESS: '1'
          ALSOFT_DRIVERS: 'null'

      # Run OpenGL tests under xvfb.
      # AITOWN_HEADLESS must NOT appear here — it suppresses IrrlichtDevice init
      # which is required for requires-opengl tests.
      # ALSOFT_DRIVERS=null still applies (headless runner has no audio hardware).
      - name: Run OpenGL tests (xvfb)
        run: xvfb-run --auto-servernum ctest --test-dir "${BUILD_DIR}" -L '^requires-opengl$' --output-on-failure
        env:
          GTEST_OUTPUT: 'xml:test_results/'
          ALSOFT_DRIVERS: 'null'

      # Verify test XML files were produced.
      # if: always() — ensures this runs even if ctest fails.
      - name: Verify test XML output
        if: always()
        shell: bash
        run: |
          count=$(find test_results -name '*.xml' 2>/dev/null | wc -l)
          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: No test XML files in test_results/ — GTEST_OUTPUT may not have written output"
            exit 1
          fi
          echo "Found $count test result file(s)."

      # Publish test results via dorny/test-reporter.
      # if: always() — must post annotations even when tests fail.
      # fail-on-error: false — prevents reporter errors from masking actual test failures.
      # continue-on-error: true is a safety net for network/permissions failures.
      - name: Publish test results
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
        with:
          name: ${{ inputs.reporter_name }}
          path: 'test_results/*.xml'
          reporter: 'java-junit'
          fail-on-error: false

      # Upload test results artifact.
      # if: always() — upload even on failure for post-mortem analysis.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: ${{ inputs.test_artifact_name }}
          path: test_results/
          retention-days: 14
