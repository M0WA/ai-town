# Package Windows — reusable workflow
# NSIS installer via CPack.
# Runs only on push to main/develop (not PRs). Not in all-checks-pass gate.
# Rebuilds from source after build-windows passes (quality gate only).
# Called by ci.yml with vcpkg_commit_id input.
# No if: condition here — the if: condition is set by the caller in ci.yml.
name: Package Windows

on:
  workflow_call:
    inputs:
      vcpkg_commit_id:
        type: string
        required: true
      pkg_version:
        type: string
        required: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      # Set up MSVC environment (vcvarsall x64) before vcpkg so cold-cache builds
      # use the same toolchain as the subsequent cmake configure.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c  # v1.13.0

      # Install vcpkg dependencies after msvc-dev-cmd so cold-cache source builds
      # use the same cl.exe that cmake will use.
      - name: Install vcpkg dependencies
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1  # v11.5
        with:
          vcpkgGitCommitId: ${{ inputs.vcpkg_commit_id }}

      - name: Resolve package version
        id: pkgver
        shell: pwsh
        run: echo "version=${{ inputs.pkg_version }}" >> $env:GITHUB_OUTPUT

      # CMake configure only — does NOT build the binaries.
      # Purpose: produce CMakeCache.txt so that cpack -C Release can locate install
      # rules and NSIS script templates embedded in the build system.
      # The actual aitown.exe and DLLs come from the staging artifact downloaded below.
      - name: CMake configure (for CPack metadata only)
        shell: pwsh
        run: cmake --preset ci-windows -DAITOWN_ASSETS_DIR=assets -DBUILD_TESTING=OFF "-DCPACK_PACKAGE_VERSION=${{ steps.pkgver.outputs.version }}"

      - name: Append vcpkg DLL directory to PATH
        shell: pwsh
        run: |
          $vcpkgBin = "build\vcpkg_installed\x64-windows\bin"
          echo "$vcpkgBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download Windows staging artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: aitown-staging-windows-${{ github.sha }}
          path: build/

      # Verify aitown.exe is present in the staging artifact before running cpack.
      # Prevents a silent packaging failure where cpack succeeds but installs an empty bundle.
      - name: Verify aitown.exe in staging artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "build\aitown.exe")) {
            Write-Error "ERROR: aitown.exe not found in build/ — staging artifact download may have failed"
            exit 1
          }
          Write-Host "aitown.exe present in staging artifact."

      - name: Create Windows installer
        shell: pwsh
        working-directory: build
        run: cpack -G NSIS -C Release

      - name: Upload Windows installer
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: aitown-installer-windows-${{ github.sha }}
          path: build/aitown-*.exe
          retention-days: 30
