# SonarCloud analysis triggered after CI completes.
# Downloads the Sonar Generic Coverage XML artifact produced by coverage-linux and runs the scan.
# Note: SonarSource composite actions transitively use unpinned actions/cache@v4,
# which is blocked by this repo's "all actions must be SHA-pinned" policy.
# Instead we inline the scanner steps directly so every action reference is SHA-pinned.
name: SonarCloud analysis

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI run ID to pull artifacts from (find in Actions URL)'
        required: true
        type: string

permissions:
  pull-requests: read

env:
  SONAR_SCANNER_VERSION: 7.0.2.4839
  SONAR_SCANNER_BINARIES_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli

jobs:
  Analysis:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Check out the exact commit that CI tested so the workspace matches the
      # file paths in coverage.xml. Using head_sha (not head_branch) is safe:
      # the scanner performs static analysis only — it never executes user code
      # (no build/install steps follow this checkout) — and workflow_dispatch
      # falls back to the default branch sha.
      # codeql[actions/untrusted-checkout/high]: SonarCloud scanner is read-only static analysis; no user code is executed after this checkout.
      - name: Checkout triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Download Sonar Generic Coverage XML
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: coverage-sonar-linux-${{ github.event.workflow_run.id || inputs.ci_run_id }}
          run-id: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Download compile_commands.json
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: compile-commands-linux-${{ github.event.workflow_run.id || inputs.ci_run_id }}
          run-id: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          github-token: ${{ github.token }}

      # The compile_commands.json was produced inside a Docker container where
      # GITHUB_WORKSPACE is mounted at /__w/<owner>/<repo>.  On this ubuntu-latest
      # runner the checkout lives at /home/runner/work/<owner>/<repo>.
      # Replace every occurrence of the container prefix so Sonar CFamily can
      # resolve source files on disk.  Without this all 138 compilation units are
      # reported as "skipped unsupported" and analysis produces 0 C/C++ issues.
      - name: Remap compile_commands.json paths to runner workspace
        run: |
          python3 - <<'EOF'
          import json, os, re
          workspace = os.environ["GITHUB_WORKSPACE"]
          with open("compile_commands.json") as f:
              db = json.load(f)
          pat = re.compile(r"/__w/[^/]+/[^/]+")
          for entry in db:
              for key in ("file", "directory", "command"):
                  if key in entry:
                      entry[key] = pat.sub(workspace, entry[key])
          with open("compile_commands.json", "w") as f:
              json.dump(db, f)
          print(f"Remapped {len(db)} entries to {workspace}")
          EOF

      - name: Debug compile_commands.json paths
        run: |
          echo "=== GITHUB_WORKSPACE ==="
          echo "$GITHUB_WORKSPACE"
          echo "=== First entry (file + directory) ==="
          python3 -c "
          import json
          with open('compile_commands.json') as f:
              db = json.load(f)
          e = db[0]
          print('file:     ', e.get('file',''))
          print('directory:', e.get('directory',''))
          print('command[:120]:', e.get('command','')[:120])
          print(f'Total entries: {len(db)}')
          "
          echo "=== File exists check (first entry) ==="
          python3 -c "
          import json, os
          with open('compile_commands.json') as f:
              db = json.load(f)
          missing = [e['file'] for e in db if not os.path.exists(e.get('file',''))]
          print(f'Missing files: {len(missing)} / {len(db)}')
          if missing:
              print('First 5 missing:', missing[:5])
          "

      - name: Cache Sonar Scanner CLI
        id: sonar-scanner-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/sonar-scanner-cli-${{ env.SONAR_SCANNER_VERSION }}-Linux-X64
          key: sonar-scanner-cli-${{ env.SONAR_SCANNER_VERSION }}-Linux-X64

      - name: Install Sonar Scanner CLI
        if: steps.sonar-scanner-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sonarscanner"
          cd "$RUNNER_TEMP/sonarscanner"
          SCANNER_FILE="sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-x64.zip"
          curl --proto '=https' --tlsv1.2 \
               --fail --silent --show-error \
               --user-agent sonarqube-scan-action \
               --location --output "$SCANNER_FILE" \
               "${SONAR_SCANNER_BINARIES_URL}/${SCANNER_FILE}"
          unzip -q -o "$SCANNER_FILE"
          mv -f "sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64" \
               "$RUNNER_TEMP/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-Linux-X64"

      - name: Run SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          PROJECT_VERSION=$(git describe --tags --always)
          SCANNER_BIN="$RUNNER_TEMP/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-Linux-X64/bin/sonar-scanner"
          "$SCANNER_BIN" \
            -Dsonar.projectKey=M0WA_ai-town \
            -Dsonar.organization=m0wa \
            -Dsonar.projectVersion="${PROJECT_VERSION}" \
            -Dsonar.sources=src,.github/workflows,docker,.devcontainer \
            -Dsonar.tests=tests \
            -Dsonar.coverageReportPaths=coverage.xml \
            -Dsonar.exclusions="assets/**,build/**,tools/**" \
            -Dsonar.coverage.exclusions="src/benchmark/**" \
            -Dsonar.cpd.exclusions="tests/**" \
            -Dsonar.scm.provider=git \
            -Dsonar.projectBaseDir=. \
            -Dsonar.cfamily.compile-commands=compile_commands.json \
            -Dsonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6 \
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S5028 \
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=src/rendering/VRAMProfiler.h \
            -Dsonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S5028 \
            -Dsonar.issue.ignore.multicriteria.e2.resourceKey=src/benchmark/benchmark_main.cpp \
            -Dsonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S5028 \
            -Dsonar.issue.ignore.multicriteria.e3.resourceKey=src/benchmark/model_validator_main.cpp \
            -Dsonar.issue.ignore.multicriteria.e4.ruleKey=cpp:S5008 \
            -Dsonar.issue.ignore.multicriteria.e4.resourceKey=src/audio/AudioSystem.cpp \
            -Dsonar.issue.ignore.multicriteria.e5.ruleKey=cpp:S5025 \
            -Dsonar.issue.ignore.multicriteria.e5.resourceKey=src/rendering/IrrlichtRenderer.cpp \
            -Dsonar.issue.ignore.multicriteria.e6.ruleKey=cpp:S5025 \
            -Dsonar.issue.ignore.multicriteria.e6.resourceKey=src/benchmark/model_validator_main.cpp
