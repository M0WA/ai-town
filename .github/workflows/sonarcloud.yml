# SonarCloud analysis triggered after CI completes.
# Downloads the Cobertura XML artifact produced by coverage-linux and runs the scan.
name: SonarCloud analysis

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # SECURITY: workflow_run executes with base-branch secrets.
      # Never check out the PR HEAD (untrusted contributor code).
      # Check out the base branch only; coverage data comes from the
      # already-vetted CI artifact, not from re-running untrusted code.
      - name: Checkout base branch (trusted — no PR code)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Download Cobertura coverage XML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.1.0
        with:
          name: coverage-cobertura-linux-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8  # v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=M0WA_ai-town
            -Dsonar.organization=m0wa
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.coverageReportPaths=coverage.xml
            -Dsonar.exclusions=assets/**,build/**,tools/**
            -Dsonar.cpd.exclusions=tests/**
            -Dsonar.scm.provider=git
          projectBaseDir: .
